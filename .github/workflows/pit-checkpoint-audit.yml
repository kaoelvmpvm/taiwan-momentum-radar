name: PIT quarterly disclosure checkpoint audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'pit_checkpoint_audit.py'
      - 'pit_checkpoint_tests.py'
      - '.github/workflows/pit-checkpoint-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -m unittest pit_checkpoint_tests -v
      - run: python -u pit_checkpoint_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-quarterly-checkpoints
          path: pit-checkpoint-output/
          retention-days: 30
