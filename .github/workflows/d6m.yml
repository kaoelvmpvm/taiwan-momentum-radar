name: D6-M + I2 daily research
on:
  workflow_dispatch:
  schedule:
    # Taipei: 22:17, 23:17; next weekday 07:17 and 08:07 (before market open).
    - cron: '17 14 * * 1-5'
    - cron: '17 15 * * 1-5'
    - cron: '17 23 * * 0-4'
    - cron: '7 0 * * 1-5'
  push:
    paths:
      - '.github/workflows/d6m.yml'
      - 'd6m_live.py'
      - 'site/index.html'
      - 'tests/test_d6m_live.py'
      - 'tests/test_d6m_site.py'
      - 'scripts/sync_d6m_site.py'
      - 'paper_calendar.json'
permissions:
  contents: read
concurrency:
  group: d6m-daily
  cancel-in-progress: false
jobs:
  update:
    name: Update research snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore verified dated turnover reports
        uses: actions/cache/restore@v4
        with:
          path: .d6m-raw
          key: d6m-turnover-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            d6m-turnover-v2-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test strategy rules
        run: python -m unittest discover -s tests -v
      - name: Fetch and evaluate signals
        id: evaluate
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$SCHEDULE" ] && python -c "import d6m_live as d; from datetime import datetime; a=d.read(d.DATA); assert a['status']=='complete' and a['asof']==d.expected_session(datetime.now(d.radar.TZ),d.calendar())"; then
            echo 'Already validated for latest session; retry not needed'
          else
            python d6m_live.py
          fi
      - name: Commit verified data or stale status
        if: always() && !cancelled() && (steps.evaluate.outcome == 'success' || steps.evaluate.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add d6m_state.json site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update D6-M research snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('site/data.json'))
          print('## D6-M + I2')
          print(f"- 行情日期：{d['asof']}")
          print(f"- 狀態：{d['status']}，{d['coverage']}/150 檔")
          print(f"- 模型核心：{d['current_core']}")
          print(f"- {d['message']}")
          if d['preview']:
              print('- 每日預覽候選：'+', '.join(d['preview']['i2']))
          if d['formal']:
              print('- 最新正式訊號：'+d['formal']['signal_date'])
          PY
      - name: Mark data issue
        if: steps.evaluate.outcome == 'failure'
        run: echo "::warning::部分或全部行情未通過稽核；不發出新的正式信號。"
      - name: Upload optional GitHub Pages bundle
        if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Prune old turnover cache
        if: always() && !cancelled()
        run: |
          mkdir -p .d6m-raw
          python - <<'PY'
          from datetime import datetime,timedelta,timezone
          from pathlib import Path
          cutoff=(datetime.now(timezone(timedelta(hours=8))).date()-timedelta(days=60)).isoformat()
          for p in Path('.d6m-raw').glob('*.json'):
              if p.name[:10]<cutoff:p.unlink()
          PY
      - name: Save verified dated turnover reports for next run
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .d6m-raw
          key: d6m-turnover-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Archive verified source reports
        if: always() && !cancelled() && (steps.evaluate.outcome == 'success' || steps.evaluate.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: d6m-verified-turnover-${{ github.run_id }}-${{ github.run_attempt }}
          path: .d6m-raw/*.json
          retention-days: 45
          if-no-files-found: ignore
      - name: Report incomplete data as failed run
        if: always() && !cancelled() && steps.evaluate.outcome == 'failure'
        run: |
          echo "::error::資料尚未完整；已保留驗證資料，待下一次排程或人工重跑補齊。"
          exit 1
  sync_public:
    name: Optional direct public sync and read-back
    if: vars.DIRECT_SITE_SYNC_ENABLED == 'true'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish only site/data.json using ephemeral identity
        run: python3 scripts/sync_d6m_site.py
  deploy:
    name: Optional GitHub Pages deployment
    if: vars.PAGES_ENABLED == 'true'
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
