name: 150-stock exploratory backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'exploratory_rotation.py'
      - 'exploratory_pool_20261125.json'
      - '.github/workflows/exploratory.yml'
permissions:
  contents: read
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u exploratory_rotation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exploratory-150-stock-results
          path: exploratory-output/
          retention-days: 30
