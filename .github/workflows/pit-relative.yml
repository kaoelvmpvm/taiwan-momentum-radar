name: PIT P3 P4 relative momentum
on:
  workflow_dispatch:
  push:
    paths:
      - 'pit_relative_experiments.py'
      - '.github/workflows/pit-relative.yml'
permissions:
  contents: read
  actions: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: pit-price-audit
          run-id: '45724949827'
          github-token: ${{ github.token }}
          path: pit-price-input
      - uses: actions/download-artifact@v4
        with:
          name: pit-reconcile-audit
          run-id: '45717164913'
          github-token: ${{ github.token }}
          path: pit-reconcile-input
      - uses: actions/download-artifact@v4
        with:
          name: pit-special-audit
          run-id: '45726492044'
          github-token: ${{ github.token }}
          path: pit-special-input
      - uses: actions/download-artifact@v4
        with:
          name: pit-provisional-backtest
          run-id: '45727730233'
          github-token: ${{ github.token }}
          path: pit-prior-backtest
      - uses: actions/download-artifact@v4
        with:
          name: pit-persistence-experiments
          run-id: '45742736713'
          github-token: ${{ github.token }}
          path: pit-persistence-input
      - run: pip install -r requirements.txt beautifulsoup4
      - run: python -u pit_relative_experiments.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-relative-experiments
          path: pit-relative-output/
          retention-days: 30
