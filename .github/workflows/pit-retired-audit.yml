name: PIT retired-stock price and merger audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'pit_retired_audit.py'
      - 'backtest/pit_retired_actions.json'
      - '.github/workflows/pit-retired-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: independent-regime-results
          run-id: '45632267524'
          github-token: ${{ github.token }}
          path: pit-benchmark
      - run: pip install requests pandas
      - run: python -u pit_retired_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retired-stock-source-audit
          path: pit-retired-output/
          retention-days: 30
