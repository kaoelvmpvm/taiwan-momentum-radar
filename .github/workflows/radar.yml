name: Daily momentum radar
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore verified dated ETF holdings
        uses: actions/cache/restore@v4
        with:
          path: .fund-raw
          key: radar-funds-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            radar-funds-v1-
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate data
        run: python radar.py
      - name: Prune and preserve independently verified ETF holdings
        if: always() && !cancelled()
        run: |
          mkdir -p .fund-raw
          python - <<'PYCODE'
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          cutoff = (datetime.now(ZoneInfo("Asia/Taipei")).date() - timedelta(days=60)).isoformat()
          for p in Path(".fund-raw").glob("*_fund_*.json"):
              if p.name[:10] < cutoff: p.unlink()
          PYCODE
      - name: Save independently verified ETF holdings
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .fund-raw
          key: radar-funds-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save private research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-report
          path: report/
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: radar
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get research report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: radar-report
          path: report
      - name: Update private dashboard
        id: dashboard
        env:
          RADAR_RESULT: ${{ needs.radar.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 dashboard.py --run-result "$RADAR_RESULT" --run-url "$RUN_URL"
      - uses: actions/setup-python@v5
        if: ${{ always() && !cancelled() }}
        with:
          python-version: '3.11'
          cache: pip
      - name: Install paper research dependencies
        if: ${{ always() && !cancelled() }}
        run: pip install -r requirements.txt
      - name: Update forward paper experiment
        id: paper
        if: ${{ always() && !cancelled() && steps.dashboard.outcome == 'success' }}
        env:
          RADAR_RESULT: ${{ needs.radar.result }}
        run: python paper.py --run-result "$RADAR_RESULT"
      - name: Render integrated research view
        if: ${{ always() && !cancelled() }}
        env:
          RADAR_RESULT: ${{ needs.radar.result }}
          PAPER_RESULT: ${{ steps.paper.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 research_view.py --radar-result "$RADAR_RESULT" --paper-result "$PAPER_RESULT" --run-url "$RUN_URL"
      - name: Build daily and period research reports
        if: ${{ always() && !cancelled() }}
        env:
          RADAR_RESULT: ${{ needs.radar.result }}
          PAPER_RESULT: ${{ steps.paper.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 research_reports.py --radar-result "$RADAR_RESULT" --paper-result "$PAPER_RESULT" --run-url "$RUN_URL"
      - name: Save private dashboard snapshot
        if: ${{ always() && !cancelled() && (steps.dashboard.outcome == 'success' || steps.dashboard.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          if git diff --cached --quiet; then
            echo "No dashboard change"
          else
            git commit -m "Update private research dashboard [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
