name: Daily momentum radar
on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * 1-5'
  push:
    paths:
      - '.github/workflows/radar.yml'
      - 'radar.py'
      - 'dashboard.py'
      - 'requirements.txt'
      - 'tests/**'
permissions:
  contents: read
concurrency:
  group: daily-radar
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch and validate data
        run: python radar.py
      - name: Save private research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-report
          path: report/
          retention-days: 30
          if-no-files-found: warn

  publish:
    needs: radar
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Get research report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: radar-report
          path: report
      - name: Update private dashboard
        id: dashboard
        env:
          RADAR_RESULT: ${{ needs.radar.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 dashboard.py --run-result "$RADAR_RESULT" --run-url "$RUN_URL"
      - name: Save private dashboard snapshot
        if: ${{ always() && !cancelled() && (steps.dashboard.outcome == 'success' || steps.dashboard.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          if git diff --cached --quiet; then
            echo "No dashboard change"
          else
            git commit -m "Update private research dashboard [skip ci]"
            git push origin HEAD:main
          fi
