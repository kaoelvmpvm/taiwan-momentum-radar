name: PIT remaining splits and historical OTC endpoint audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'pit_market_audit.py'
      - '.github/workflows/pit-market.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: pit-price-audit
          run-id: '45724949827'
          github-token: ${{ github.token }}
          path: pit-price-input
      - uses: actions/download-artifact@v4
        with:
          name: pit-special-audit
          run-id: '45726492044'
          github-token: ${{ github.token }}
          path: pit-special-input
      - uses: actions/download-artifact@v4
        with:
          name: pit-timing-audit
          run-id: '45720708521'
          github-token: ${{ github.token }}
          path: pit-timing-input
      - run: pip install -r requirements.txt beautifulsoup4
      - run: python -u pit_market_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pit-market-audit
          path: pit-market-output/
          retention-days: 30
