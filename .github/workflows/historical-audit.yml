name: Historical holdings feasibility audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'historical_holdings_audit.py'
      - '.github/workflows/historical-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python -u historical_holdings_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-holdings-audit
          path: historical-audit/
          retention-days: 30
