name: Independent regime momentum experiments
on:
  workflow_dispatch:
  push:
    paths:
      - 'regime_experiments.py'
      - '.github/workflows/regime-experiments.yml'
      - 'tests/test_regime_experiments.py'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_regime_experiments.py' -v
      - run: python -u regime_experiments.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-regime-results
          path: regime-output/
          retention-days: 30
