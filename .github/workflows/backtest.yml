name: V0.4 rotation engine verification
on:
  workflow_dispatch:
  push:
    paths:
      - 'rotation_engine.py'
      - 'tests/test_rotation_engine.py'
      - '.github/workflows/backtest.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_rotation_engine.py' -v
