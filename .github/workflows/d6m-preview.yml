name: D6-M + I2 previous-session preview
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/d6m-preview.yml'
      - 'd6m_preview.py'
      - 'tests/test_d6m_preview.py'
permissions:
  contents: write
concurrency:
  group: d6m-daily
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore verified dated turnover reports
        uses: actions/cache/restore@v4
        with:
          path: .d6m-raw
          key: d6m-turnover-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            d6m-turnover-v2-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test preview safeguards
        run: python -m unittest discover -s tests -p 'test_d6m_preview.py' -v
      - name: Compute yesterday turnover and I2 preview
        run: python d6m_preview.py
      - name: Commit preview only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish explicitly dated lagged-turnover preview [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Ensure report cache directory
        if: always() && !cancelled()
        run: mkdir -p .d6m-raw
      - name: Save verified dated turnover reports for next run
        if: always() && !cancelled()
        uses: actions/cache/save@v4
        with:
          path: .d6m-raw
          key: d6m-turnover-v2-${{ github.run_id }}-${{ github.run_attempt }}
